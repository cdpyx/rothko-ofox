name: OrangeFox rothko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker rmi $(sudo docker images -aq) 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libncurses5 lib32ncurses-dev libxml2-utils \
            xsltproc unzip fontconfig python3 bc lz4 lzop cpio rsync

      - name: 初始化 OrangeFox fox_14.1 源码
        run: |
          mkdir -p ~/fox && cd ~/fox
          repo init --depth=1 -u https://gitlab.com/orangefox/manifest.git -b fox_14.1
          repo sy
          # 自动探测 lunch 名 (omni_/twrp_/fox_ 开头)
          COMBO=$(ls device/xiaomi/rothko/ | grep -E '^(omni|twrp|fox)_rothko\.mk$' | head -1 | sed 's/\.mk$//')
          echo "检测到 lunch combo: ${COMBO}-eng"
          lunch ${COMBO}-eng
          # recovery 合并进 boot 的机器,产物是 boot.img;也兼容有独立 recovery 的情况
          mka bootimage -j$(nproc) || mka recoveryimage -j$(nproc)
          echo "=== 产物 ==="
          ls -la out/target/product/rothko/*.img

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-rothko
          path: ~/fox/out/target/product/rothko/*.img
          if-no-files-found: warn
