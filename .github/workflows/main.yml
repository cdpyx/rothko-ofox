name: Build TWRP for rothko (Xiaomi 15T Pro)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-14'
      device_tree_repo:
        description: 'Device tree repo URL'
        required: true
        default: 'https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp'

env:
  ALLOW_MISSING_DEPENDENCIES: true
  LC_ALL: C

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 清理磁盘空间
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== 清理后 ==="
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git repo python3 openjdk-17-jdk \
            gcc g++ make lz4 cpio \
            zip unzip curl wget \
            bc bison flex libssl-dev \
            libncurses-dev mtools \
            dosfstools e2fsprogs \
            rsync xz-utils \
            libelf-dev libz-dev
          echo "java: $(java -version 2>&1 | head -1)"

      # ================= 缓存 .repo 目录以加速同步 =================
      - name: 缓存 TWRP .repo (加速同步)
        id: cache-repo
        uses: actions/cache@v4
        with:
          path: ~/fox/.repo
          key: twrp-repo-${{ inputs.manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            twrp-repo-${{ inputs.manifest_branch }}-
      # ==================================================================

      - name: 同步 TWRP 源码
        run: |
          set -eo pipefail
          mkdir -p ~/fox && cd ~/fox
          
          echo "=== repo init (branch: ${{ inputs.manifest_branch }}) ==="
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ inputs.manifest_branch }} \
            --depth=1 2>&1 | tail -5
            
          echo "=== repo sync (利用缓存加速) ==="
          repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc) 2>&1 | tail -30
          
          echo "=== 优化缓存体积 (Git GC) ==="
          repo forall -c 'git gc --prune=now' 2>/dev/null || true
          
          echo "=== 验证同步完整性 ==="
          if [ ! -f build/envsetup.sh ] && [ ! -f build/make/envsetup.sh ]; then
            echo "!!! envsetup.sh 不存在，repo sync 不完整，重试一次..."
            repo sync -c --force-sync -j$(nproc) 2>&1 | tail -30
          fi
          echo "=== 同步完成，磁盘使用 ==="
          df -h /
          du -sh ~/fox 2>/dev/null
          du -sh ~/fox/.repo 2>/dev/null

      - name: 克隆 Device Tree
        run: |
          cd ~/fox
          mkdir -p device/xiaomi/rothko
          echo "=== cloning ${{ inputs.device_tree_repo }} ==="
          git clone --depth=1 ${{ inputs.device_tree_repo }} device/xiaomi/rothko 2>&1 | tail -5
          echo "=== device tree 文件列表 ==="
          find device/xiaomi/rothko -maxdepth 2 -type f | sort

      - name: 诊断:构建系统检查
        run: |
          cd ~/fox
          echo "=== release 配置 ==="
          ls build/release/release_configs/ 2>/dev/null || echo "build/release/release_configs/ 不存在"
          echo ""
          echo "=== device tree AndroidProducts.mk ==="
          cat device/xiaomi/rothko/AndroidProducts.mk 2>/dev/null || echo "未找到 AndroidProducts.mk"

      - name: 补全 release config 并编译
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # ---- 强制补全 TWRP manifest 缺失的 release config ----
          # 修复：移除 Heredoc，改用 echo 避免 YAML 缩进导致的 Bash 语法错误
          mkdir -p build/release/release_configs
          for rel in ap1a ap2a ap3a ap4a; do
            if [ ! -f "build/release/release_configs/${rel}.mk" ]; then
              echo ">>> 创建缺失的 release config: ${rel}.mk"
              echo "# Dummy release config for TWRP build" > "build/release/release_configs/${rel}.mk"
              echo "RELEASE_DEFAULT_PRODUCT := aosp_product" >> "build/release/release_configs/${rel}.mk"
            fi
          done
          echo ">>> 当前 release configs: $(ls build/release/release_configs/)"

          # ---- 初始化构建环境 ----
          ENVSETUP=""
          if [ -f build/envsetup.sh ]; then
            ENVSETUP="build/envsetup.sh"
          elif [ -f build/make/envsetup.sh ]; then
            ENVSETUP="build/make/envsetup.sh"
          else
            echo "!!! envsetup.sh 完全不存在！"
            exit 1
          fi
          echo ">>> source $ENVSETUP"
          source "$ENVSETUP"

          # ---- 尝试 lunch (改进检测逻辑) ----
          LUNCH_OK=0
          for rel in ap1a ap2a ap3a ap4a; do
            echo ">>> 尝试 lunch twrp_rothko-${rel}-eng"
            lunch twrp_rothko-${rel}-eng > /tmp/lunch_out.txt 2>&1
            if [ -n "$TARGET_PRODUCT" ] && [ "$TARGET_PRODUCT" = "twrp_rothko" ]; then
              echo ">>> SUCCESS: twrp_rothko-${rel}-eng"
              LUNCH_OK=1
              break
            fi
          done

          if [ "$LUNCH_OK" != 1 ]; then
            echo ">>> 新式 lunch 失败，尝试旧式两段式"
            for combo in twrp_rothko-eng omni_rothko-eng; do
              echo ">>> 尝试 lunch ${combo}"
              lunch ${combo} > /tmp/lunch_out.txt 2>&1
              if [ -n "$TARGET_PRODUCT" ] && [[ "$TARGET_PRODUCT" == *"rothko"* ]]; then
                echo ">>> SUCCESS: ${combo}"
                LUNCH_OK=1
                break
              fi
            done
          fi

          if [ "$LUNCH_OK" != 1 ]; then
            echo "!!! 所有 lunch 组合均失败"
            echo "=== Lunch 输出日志 ==="
            cat /tmp/lunch_out.txt
            exit 1
          fi

          # ---- 编译 ----
          echo ""
          echo ">>> 开始编译 (CPU cores: $(nproc))"
          mka recoveryimage -j"$(nproc)" 2>&1 | tail -50

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-rothko
          path: |
            ~/fox/out/target/product/rothko/*.img
            ~/fox/out/target/product/rothko/recovery*.img
            ~/fox/out/target/product/rothko/boot*.img
          if-no-files-found: warn
