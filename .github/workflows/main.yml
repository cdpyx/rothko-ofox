name: Build TWRP for rothko (Xiaomi 15T Pro)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-14'
      device_tree_repo:
        description: 'Device tree repo URL'
        required: true
        default: 'https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp'

env:
  ALLOW_MISSING_DEPENDENCIES: true
  LC_ALL: C
  USE_CCACHE: 1
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_EXEC: /usr/bin/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 清理磁盘空间
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== 清理后 ==="
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git repo python3 openjdk-17-jdk ccache \
            gcc g++ make lz4 cpio \
            zip unzip curl wget \
            bc bison flex libssl-dev \
            libncurses-dev mtools \
            dosfstools e2fsprogs \
            rsync xz-utils \
            libelf-dev libz-dev
          echo "java: $(java -version 2>&1 | head -1)"

      - name: 缓存 CCACHE (加速编译)
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-twrp-${{ inputs.manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-twrp-${{ inputs.manifest_branch }}-

      - name: 同步 TWRP 源码
        run: |
          set -eo pipefail
          mkdir -p ~/fox && cd ~/fox
          
          echo "=== repo init (branch: ${{ inputs.manifest_branch }}) ==="
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ inputs.manifest_branch }} \
            --depth=1 2>&1 | tail -5
            
          echo "=== repo sync ==="
          repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc) 2>&1 | tail -30
          
          echo "=== 验证同步完整性 ==="
          if [ ! -f build/envsetup.sh ] && [ ! -f build/make/envsetup.sh ]; then
            echo "!!! envsetup.sh 不存在，重试..."
            repo sync -c --force-sync -j$(nproc) 2>&1 | tail -30
          fi
          echo "=== 同步完成 ==="
          df -h /

      - name: 克隆 Device Tree
        run: |
          cd ~/fox
          mkdir -p device/xiaomi/rothko
          echo "=== cloning ${{ inputs.device_tree_repo }} ==="
          git clone --depth=1 ${{ inputs.device_tree_repo }} device/xiaomi/rothko 2>&1 | tail -5

      - name: 补全 release config 并强制适配 Device Tree
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # ---- 1. 强制补全 release config (修复：必须放在 build/release/ 根目录，而非子目录) ----
          mkdir -p build/release
          for rel in ap1a ap2a ap3a ap4a; do
            echo ">>> 创建 release config: build/release/${rel}.mk"
            echo "RELEASE_PLATFORM_VERSION := 14" > "build/release/${rel}.mk"
            echo "RELEASE_PLATFORM_VERSION_CODENAME := UpsideDownCake" >> "build/release/${rel}.mk"
            echo "RELEASE_PLATFORM_SDK_VERSION := 34" >> "build/release/${rel}.mk"
            echo "RELEASE_DEFAULT_PRODUCT := aosp_product" >> "build/release/${rel}.mk"
          done
          echo ">>> 当前 release configs: $(ls build/release/*.mk)"

          # ---- 2. 修正 Device Tree 的 Product MK 查找逻辑 (修复：不再错误覆盖为 Android.mk) ----
          cd device/xiaomi/rothko
          echo ">>> 原始 Device Tree 文件:"
          ls -la *.mk 2>/dev/null
          
          # 优先使用已存在的 twrp_rothko.mk 或 omni_rothko.mk
          if [ -f "twrp_rothko.mk" ]; then
            echo ">>> 找到并保留现有的 twrp_rothko.mk"
          elif [ -f "omni_rothko.mk" ]; then
            echo ">>> 找到 omni_rothko.mk，复制为 twrp_rothko.mk"
            cp "omni_rothko.mk" "twrp_rothko.mk"
          else
            # 兜底：寻找包含 rothko 的 mk 文件，排除 Android.mk 和 BoardConfig.mk
            PRODUCT_MK=$(ls *rothko*.mk 2>/dev/null | grep -v "AndroidProducts.mk" | grep -v "BoardConfig.mk" | grep -v "Android.mk" | head -1)
            if [ -n "$PRODUCT_MK" ]; then
              echo ">>> 找到 $PRODUCT_MK，复制为 twrp_rothko.mk"
              cp "$PRODUCT_MK" "twrp_rothko.mk"
            else
              echo "!!! 找不到任何有效的 product mk 文件，创建空白 twrp_rothko.mk"
              echo "PRODUCT_NAME := twrp_rothko" > twrp_rothko.mk
              echo "PRODUCT_DEVICE := rothko" >> twrp_rothko.mk
            fi
          fi

          # ---- 3. 彻底重写 AndroidProducts.mk (使用 echo 避免 Heredoc 缩进问题) ----
          echo "PRODUCT_MAKEFILES := \\" > AndroidProducts.mk
          echo "    \$(LOCAL_DIR)/twrp_rothko.mk" >> AndroidProducts.mk
          echo "" >> AndroidProducts.mk
          echo "COMMON_LUNCH_CHOICES := \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap1a-eng \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap1a-user \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap1a-userdebug \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap2a-eng \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap3a-eng \\" >> AndroidProducts.mk
          echo "    twrp_rothko-ap4a-eng" >> AndroidProducts.mk
          
          echo ">>> 已重写 AndroidProducts.mk，内容如下："
          cat AndroidProducts.mk
          cd ~/fox

          # ---- 4. 初始化构建环境 ----
          ENVSETUP="build/envsetup.sh"
          [ ! -f "$ENVSETUP" ] && ENVSETUP="build/make/envsetup.sh"
          echo ">>> source $ENVSETUP"
          source "$ENVSETUP"

          # 配置 ccache
          ccache -M 10G
          ccache -z

          # ---- 5. 尝试 lunch (带详细日志) ----
          LUNCH_OK=0
          for rel in ap1a ap2a ap3a ap4a; do
            echo ""
            echo ">>> 尝试 lunch twrp_rothko-${rel}-eng"
            lunch twrp_rothko-${rel}-eng > /tmp/lunch_out.txt 2>&1 || true
            
            if [ -n "$TARGET_PRODUCT" ] && [ "$TARGET_PRODUCT" = "twrp_rothko" ]; then
              echo ">>> SUCCESS: twrp_rothko-${rel}-eng"
              LUNCH_OK=1
              break
            fi
          done

          if [ "$LUNCH_OK" != 1 ]; then
            echo "!!! 所有 lunch 组合均失败，输出详细日志："
            cat /tmp/lunch_out.txt
            echo ""
            echo "=== 当前系统识别的 LUNCH CHOICES ==="
            get_build_var COMMON_LUNCH_CHOICES 2>/dev/null || echo "获取失败"
            exit 1
          fi

          # ---- 6. 编译 ----
          echo ""
          echo ">>> 开始编译 (CPU cores: $(nproc))"
          mka recoveryimage -j"$(nproc)" 2>&1 | tail -100
          
          ccache -s

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-rothko
          path: |
            ~/fox/out/target/product/rothko/*.img
            ~/fox/out/target/product/rothko/recovery*.img
            ~/fox/out/target/product/rothko/boot*.img
          if-no-files-found: warn
