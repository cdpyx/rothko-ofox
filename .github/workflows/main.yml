name: OrangeFox rothko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GIT_TERMINAL_PROMPT: 0
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker rmi $(sudo docker images -aq) 2>/dev/null || true
          df -h /

      - name: 安装依赖 + 最新 repo 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libxml2-utils xsltproc unzip fontconfig \
            python3 bc lz4 lzop cpio rsync libssl-dev
          # apt 源的 repo 太老,装官方最新版
          sudo curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod +x /usr/local/bin/repo
          hash -r
          repo --version
          git config --global user.email "ci@build.local"
          git config --global user.name "ci"
          git config --global credential.helper ""

      - name: 打底:TWRP 官方 minimal manifest (twrp-14)
        run: |
          set +e
          mkdir -p ~/fox && cd ~/fox
          OK=0
          for br in twrp-14 twrp-14.1 twrp-15; do
            echo "########## repo init minimal-manifest -b $br ##########"
            rm -rf .repo
            repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$br" || continue
            repo sync -c -j"$(nproc)" --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune || continue
            [ -d build ] && [ -d bootable ] && { OK=1; echo "打底成功: $br"; break; }
          done
          [ "$OK" = 1 ] || { echo "TWRP manifest 也拉不到,无法继续"; exit 1; }

      - name: 覆盖橙狐层 (vendor/fox + recovery fork)
        run: |
          set +e
          cd ~/fox
          # --- vendor/fox ---
          FOXVEND=0
          for url in https://gitlab.com/orangefox/vendor.git \
                     https://github.com/OrangeFoxRecovery/vendor.git \
                     https://github.com/OrangeFoxRecovery/fox_vendor.git; do
            for br in fox_14.1 master main; do
              echo "### 试 vendor: $url -b $br"
              rm -rf /tmp/fv
              if git clone --depth=1 -b "$br" "$url" /tmp/fv 2>&1 | tail -2; [ -d /tmp/fv ]; then
                rm -rf vendor/fox
                cp -a /tmp/fv vendor/fox
                FOXVEND=1; echo "vendor/fox 成功: $url -b $br"
                break 2
              fi
            done
          done
          # --- bootable/recovery 换成橙狐 fork ---
          FOXREC=0
          for url in https://gitlab.com/orangefox/recovery.git \
                     https://github.com/OrangeFoxRecovery/bootable_recovery.git \
                     https://github.com/OrangeFoxRecovery/recovery.git; do
            for br in fox_14.1 master main; do
              echo "### 试 recovery: $url -b $br"
              rm -rf /tmp/fr
              if git clone --depth=1 -b "$br" "$url" /tmp/fr 2>&1 | tail -2; [ -d /tmp/fr ]; then
                rm -rf bootable/recovery
                cp -a /tmp/fr bootable/recovery
                FOXREC=1; echo "recovery fork 成功: $url -b $br"
                break 2
              fi
            done
          done
          echo "======== 橙狐层状态: vendor=$FOXVEND recovery=$FOXREC ========"
          echo "(都是0则按纯 TWRP 编译,功能一样)"
          ls vendor/ 2>/dev/null
          exit 0

      - name: 拉取 rothko device tree 并转橙狐
        run: |
          cd ~/fox
          git clone --depth=1 \
            https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp \
            device/xiaomi/rothko
          cd device/xiaomi/rothko
          echo "=== 原始 mk 文件 ==="
          ls *.mk
          if [ -d ~/fox/vendor/fox ]; then
            SRC=$(ls twrp_rothko.mk omni_rothko.mk 2>/dev/null | head -1)
            echo "源产品文件: $SRC (转橙狐)"
            sed -e 's#vendor/twrp/config/common.mk#vendor/fox/config/common.mk#g' \
                -e 's#vendor/lineage/config/common.mk#vendor/fox/config/common.mk#g' \
                -e 's#PRODUCT_NAME := .*#PRODUCT_NAME := fox_rothko#' "$SRC" > fox_rothko.mk
            cat fox_rothko.mk
            {
              echo '#!/bin/bash'
              echo 'export FOX_BUILD_TYPE=Beta'
              echo 'export OF_MAINTAINER="rothko-port"'
              echo 'export OF_USE_MAGISKBOOT=1'
            } > vendorsetup.sh
          else
            echo "无 vendor/fox,按 TWRP 编译"
          fi

      - name: 编译
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          COMBO=$(ls device/xiaomi/rothko/ | grep -oE '^(fox|twrp|omni)_rothko' | head -1)
          echo "lunch combo: ${COMBO}-eng"
          lunch ${COMBO}-eng
          mka bootimage -j"$(nproc)" || mka recoveryimage -j"$(nproc)"
          echo "=== 产物 ==="
          ls -la out/target/product/rothko/*.img

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-rothko
          path: ~/fox/out/target/product/rothko/*.img
          if-no-files-found: warn
